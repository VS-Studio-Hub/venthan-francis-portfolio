<section id="education" class="section section-anchor">
  <div class="container">
    <div class="section-heading reveal">
      <p class="eyebrow">Education</p>
      <h2>Formal training with programming, UI, debugging, and team delivery foundations.</h2>
    </div>
    <article class="education-card reveal">
      <div>
        <h3>{{ data.education.school }}</h3>
        <p>{{ data.education.program }}</p>
        <strong>{{ data.education.result }}</strong>
      </div>
      <div>
        <p>{{ data.education.summary }}</p>
        <div class="tag-list">
          @for (topic of data.education.topics; track topic) {
            <span>{{ topic }}</span>
          }
        </div>
      </div>
    </article>
  </div>
</section>
